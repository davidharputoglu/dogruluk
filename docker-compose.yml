# Deux editions avec deux noms differents (choix client) :
#  - veriffact-public : edition publique, nom "VerifFact"
#  - veriffact-prive  : edition privee,   nom "VerifFact Pro"
services:
  veriffact-public:
    build: .
    image: veriffact:latest
    container_name: veriffact-public
    environment:
      VDF_EDITION: public
      VDF_APP_NAME: VerifFact          # <- changer le nom public ici
    ports: ["8080:8000"]
    volumes:
      - ./data/public:/data
      - ./exports/public:/exports
    restart: unless-stopped

  veriffact-prive:
    build: .
    image: veriffact:latest
    container_name: veriffact-prive
    environment:
      VDF_EDITION: prive
      VDF_APP_NAME: VerifFact Pro      # <- changer le nom prive ici
    ports: ["8081:8000"]
    volumes:
      - ./data/prive:/data
      - ./exports/prive:/exports
    restart: unless-stopped
